<text x="63" y="226" font-family="Georgia,serif" font-size="54" fill="#fff">Curious minds</text>
<text x="63" y="291" font-family="Georgia,serif" font-size="54" font-style="italic" fill="#c4adff">build things.</text>
<text x="67" y="349" font-family="Arial,sans-serif" font-size="18" fill="#d5d2df">From hand-coded interfaces to intelligent systems—</text>
<text x="67" y="379" font-family="Arial,sans-serif" font-size="18" fill="#d5d2df">I turn questions into things you can use.</text>
